[package]
name = "pontilha"
version = "0.1.0"
description = "Pixel art editor for Linux"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
base64 = "0.22"
percent-encoding = "2"
serde_json = "1"
tiny_http = "0.12"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
